name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      rollback_test:
        description: "Test automatic rollback"
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application import
        run: |
          python -c "from app.main import app; print('Application import successful')"

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Capture current version
        id: current
        run: |
          CURRENT_IMAGE=$(ssh \
            -o StrictHostKeyChecking=yes \
            ether@192.168.1.111 \
            'docker inspect --format="{{.Config.Image}}" homelab-app')

          CURRENT_TAG="${CURRENT_IMAGE##*:}"

          echo "Current image: ${CURRENT_IMAGE}"
          echo "Current tag: ${CURRENT_TAG}"

          case "$CURRENT_TAG" in
            sha-*)
              ;;
            *)
              echo "ERROR: Current production image is not an immutable SHA tag."
              echo "Current tag: ${CURRENT_TAG}"
              exit 1
              ;;
          esac

          echo "tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Determine deployment tag
        id: target
        run: |
          if [ "${{ inputs.rollback_test }}" = "true" ]; then
            DEPLOY_TAG="sha-deadbee"
            echo "Rollback test enabled."
            echo "Intentionally using invalid image tag: ${DEPLOY_TAG}"
          else
            DEPLOY_TAG="sha-${GITHUB_SHA::7}"
            echo "Normal deployment."
            echo "Deployment tag: ${DEPLOY_TAG}"
          fi

          echo "tag=${DEPLOY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy new version
        id: deploy
        continue-on-error: true
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            ether@192.168.1.111 \
            "/opt/homelab-app/scripts/deploy.sh ${{ steps.target.outputs.tag }}"

      - name: Verify new deployment
        id: verify
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          STATUS=$(ssh \
            -o StrictHostKeyChecking=yes \
            ether@192.168.1.111 \
            'docker inspect --format="{{.State.Health.Status}}" homelab-app')

          IMAGE=$(ssh \
            -o StrictHostKeyChecking=yes \
            ether@192.168.1.111 \
            'docker inspect --format="{{.Config.Image}}" homelab-app')

          echo "Application image: ${IMAGE}"
          echo "Application health: ${STATUS}"

          if [ "$STATUS" != "healthy" ]; then
            echo "Deployment verification failed."
            exit 1
          fi

      - name: Rollback on deployment failure
        if: always() && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          echo "Deployment failed."
          echo "Rolling back to: ${{ steps.current.outputs.tag }}"

          ssh \
            -o StrictHostKeyChecking=yes \
            ether@192.168.1.111 \
            "/opt/homelab-app/scripts/deploy.sh ${{ steps.current.outputs.tag }}"

      - name: Verify rollback
        id: rollback_verify
        if: always() && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          STATUS=$(ssh \
            -o StrictHostKeyChecking=yes \
            ether@192.168.1.111 \
            'docker inspect --format="{{.State.Health.Status}}" homelab-app')

          IMAGE=$(ssh \
            -o StrictHostKeyChecking=yes \
            ether@192.168.1.111 \
            'docker inspect --format="{{.Config.Image}}" homelab-app')

          echo "Rollback image: ${IMAGE}"
          echo "Rollback health: ${STATUS}"

          if [ "$STATUS" != "healthy" ]; then
            echo "CRITICAL: Rollback failed."
            exit 1
          fi

      - name: Fail deployment after rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          echo "Deployment failed, but rollback completed successfully."
          exit 1

      - name: Show deployed image
        if: always() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            ether@192.168.1.111 \
            'docker inspect --format="{{.Config.Image}}" homelab-app'
