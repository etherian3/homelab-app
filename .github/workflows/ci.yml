name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application import
        run: |
          python -c "from app.main import app; print('Application import successful')"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t homelab-app:test .

  deploy-test:
    name: Test Deployment Connection
    runs-on: self-hosted
    needs: docker-build

    steps:
      - name: Test management server
        run: |
          echo "Runner hostname:"
          hostname

          echo "Runner user:"
          whoami

      - name: Test application server SSH
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            ether@192.168.1.111 \
            "hostname && whoami && docker --version"
